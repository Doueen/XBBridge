<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>分页列表测试台</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; margin: 24px 32px; color: #10202a; }
  table { border-collapse: collapse; margin: 12px 0; }
  th, td { border: 1px solid #d8e0ea; padding: 6px 14px; text-align: left; }
  th { background: #f4f7fb; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid #0b7c6d;
           background: #0fa08c; color: #fff; cursor: pointer; margin-right: 8px; }
  button:disabled { opacity: .5; cursor: default; }
  #pageinfo { color: #667085; }
</style>
</head>
<body>
<h1>分页列表测试台</h1>
<p>纯前端分页：点「下一页」只换表格内容，URL 不变。<code>xb extract --next "#next" --max-pages 3</code>
   应该拿到三页合并后的行。</p>

<table id="list">
  <thead><tr><th>序号</th><th>名称</th><th>状态</th></tr></thead>
  <tbody></tbody>
</table>
<button id="next">下一页</button>
<button id="api">调用接口 data.json</button>
<span id="pageinfo">第 1 / 3 页</span>

<script>
  const pages = [
    [{ id: '1', name: '登录', status: '通过' }, { id: '2', name: '下单', status: '阻塞' }],
    [{ id: '3', name: '退款', status: '通过' }, { id: '4', name: '对账', status: '通过' }],
    [{ id: '5', name: '开票', status: '通过' }, { id: '6', name: '归档', status: '阻塞' }]
  ];
  let page = 0;
  function render() {
    const tb = document.querySelector('#list tbody');
    tb.replaceChildren();
    for (const row of pages[page]) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${row.id}</td><td>${row.name}</td><td>${row.status}</td>`;
      tb.appendChild(tr);
    }
    document.getElementById('pageinfo').textContent = `第 ${page + 1} / ${pages.length} 页`;
    document.getElementById('next').disabled = page >= pages.length - 1;
  }
  document.getElementById('next').addEventListener('click', () => {
    if (page < pages.length - 1) { page += 1; render(); }
  });
  document.getElementById('api').addEventListener('click', () => {
    fetch('/data.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
      document.getElementById('pageinfo').textContent = '接口返回 ok=' + d.ok;
    });
  });
  render();
</script>
</body>
</html>
