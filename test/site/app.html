<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xb 全功能测试台</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #101828;
    --muted: #667085;
    --line: #e4e7ec;
    --brand: #0fa08c;
    --brand-dark: #0b7c6d;
    --amber: #b54708;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 0 28px 56px;
    color: var(--ink);
    font: 15px/1.65 "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 380px at 6% -10%, #e3fbf6 0%, rgba(227, 251, 246, 0) 62%),
      radial-gradient(700px 320px at 96% 4%, #eef2ff 0%, rgba(238, 242, 255, 0) 58%),
      var(--bg);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    gap: 14px;
    align-content: start;
  }

  /* hero band: negative margin lets it bleed to the viewport edges */
  h1 {
    grid-column: 1 / -1;
    margin: 0 -28px 8px;
    padding: 30px 32px 28px;
    font-size: 26px; line-height: 1.25; letter-spacing: .2px; font-weight: 650;
    color: #fff;
    background: linear-gradient(118deg, #0b7c6d 0%, #10a394 52%, #2bb3a2 100%);
    box-shadow: 0 1px 0 rgba(16, 24, 40, .06);
  }
  h1::after {
    content: "受控标签 · 可见标记 · 租约 —— xb bridge 演示站点";
    display: block; margin-top: 8px;
    font-size: 13.5px; font-weight: 400; letter-spacing: .3px;
    color: rgba(255, 255, 255, .82);
  }

  section {
    position: relative;
    margin: 0;
    padding: 16px 20px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px -20px rgba(16, 24, 40, .25);
  }
  section::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
    border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--brand), #7bd9cc);
    opacity: .85;
  }
  h2 {
    margin: 0 0 12px; font-size: 14px; font-weight: 650; letter-spacing: .2px;
    color: #344054;
  }

  p { margin: 10px 0 0; color: var(--muted); font-size: 13.5px; }
  p#delayed { color: var(--brand-dark); font-weight: 600; }

  button, #dl {
    font: inherit; font-size: 13.5px; font-weight: 600;
    padding: 8px 15px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: #344054;
    transition: border-color .15s, box-shadow .15s, transform .05s;
  }
  button:hover, #dl:hover { border-color: #b6c2d2; box-shadow: 0 2px 8px -4px rgba(16, 24, 40, .3); }
  button:active { transform: translateY(1px); }
  #btn-slow, #btn-submit, #btn-log {
    color: #fff; border-color: transparent;
    background: linear-gradient(180deg, #12a795, #0b8a79);
    box-shadow: 0 1px 2px rgba(11, 124, 109, .35);
  }
  #btn-slow:hover, #btn-submit:hover, #btn-log:hover { filter: brightness(1.04); }

  input#q {
    font: inherit; font-size: 13.5px;
    padding: 8px 11px; margin-right: 8px;
    border: 1px solid var(--line); border-radius: 9px; background: #fbfcfe;
    color: var(--ink);
  }
  input#q:focus, select:focus { outline: 2px solid #a7e8de; outline-offset: 1px; }
  select {
    font: inherit; font-size: 13.5px; padding: 8px 11px; margin-right: 12px;
    border: 1px solid var(--line); border-radius: 9px; background: #fbfcfe; color: var(--ink);
  }
  label { color: var(--muted); font-size: 13.5px; }
  input[type="checkbox"] { accent-color: var(--brand); vertical-align: -2px; margin-right: 6px; }

  #hoverout { display: none; margin-top: 8px; color: var(--amber); font-weight: 600; }
  #hoverme { border-bottom: 1px dashed #98a2b3; cursor: help; }
  #hoverme:hover + #hoverout { display: block; }

  a#dl { display: inline-block; text-decoration: none; }

  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); background: #f9fafc; }
  th:first-child { border-radius: 9px 0 0 0; }
  th:last-child { border-radius: 0 9px 0 0; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #f9fdfc; }
  #tbl td:nth-child(2) { font-weight: 650; }
  #tbl tbody tr:nth-child(1) td:nth-child(2) { color: #067647; }
  #tbl tbody tr:nth-child(2) td:nth-child(2) { color: #b42318; }
  #tbl tbody tr:nth-child(3) td:nth-child(2) { color: #067647; }

  .spacer {
    grid-column: 1 / -1; height: 1400px; margin: 6px 0 0;
    border-radius: var(--radius);
    background:
      repeating-linear-gradient(45deg, rgba(15, 160, 140, .05) 0 12px, transparent 12px 24px),
      linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(244, 246, 250, .2));
    border: 1px dashed #d3dae6;
  }
  #bottom { grid-column: 1 / -1; text-align: center; padding: 18px 0 6px; }

  .full { grid-column: 1 / -1; }
  #dragzone { grid-column: 1 / -1; }
  #pad {
    position: relative; width: 260px; height: 120px;
    border: 1px solid #cfd8e5; border-radius: 12px;
    background: linear-gradient(180deg, #fbfdff, #f1f6fb);
  }
  #knob {
    position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #38c8b5, #0b8a79);
    box-shadow: 0 2px 8px -2px rgba(11, 138, 121, .6);
    cursor: grab;
  }
  #knob:active { cursor: grabbing; }
  code, #knobout, #clickout, #selout { font-family: Consolas, ui-monospace, monospace; }
  #knobout, #clickout, #selout { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<h1>xb 全功能测试台</h1>

<section>
  <h2>1. 等待 / 惰性元素</h2>
  <p id="delayed" style="display:none">惰性元素已出现</p>
  <button id="btn-slow" onclick="setTimeout(()=>{document.getElementById('delayed').style.display='block'},800)">0.8 秒后显示</button>
</section>

<section>
  <h2>2. 表单 / 回车提交</h2>
  <form action="/submitted.html" method="get">
    <input id="q" name="q" placeholder="输入后按回车" style="width:260px">
    <button type="submit" id="btn-submit">提交</button>
  </form>
</section>

<section>
  <h2>3. 下拉 / 复选框</h2>
  <select id="fruit">
    <option value="apple">苹果</option>
    <option value="banana">香蕉</option>
    <option value="cherry">樱桃</option>
  </select>
  <label><input type="checkbox" id="chk"> 同意</label>
  <p>当前选择：<span id="selout">apple</span></p>
  <script>document.getElementById('fruit').addEventListener('change', e => {
    document.getElementById('selout').textContent = e.target.value; });</script>
</section>

<section>
  <h2>4. 悬停</h2>
  <span id="hoverme">把鼠标放我身上</span>
  <div id="hoverout">悬停生效了</div>
</section>

<section>
  <h2>5. console / network</h2>
  <button id="btn-log" onclick="
    console.log('xb-test-log', 42);
    console.warn('xb-test-warn');
    fetch('/data.json').then(r=>r.json()).then(d=>console.log('fetched', d.ok));
  ">打印日志并请求 data.json</button>
</section>

<section>
  <h2>6. 文件上传 / 下载</h2>
  <input type="file" id="file">
  <a id="dl" href="/files/report.csv" download>下载 report.csv</a>
</section>

<section class="full">
  <h2>7. 表格抽取</h2>
  <table id="tbl">
    <thead><tr><th>项目</th><th>状态</th><th>负责人</th></tr></thead>
    <tbody>
      <tr><td>登录</td><td>通过</td><td>甲</td></tr>
      <tr><td>下单</td><td>阻塞</td><td>乙</td></tr>
      <tr><td>退款</td><td>通过</td><td>丙</td></tr>
    </tbody>
  </table>
</section>

<div class="spacer"></div>
<p id="bottom">页面底部</p>

<section id="dragzone">
  <h2>8. 拖拽 / 真实鼠标事件</h2>
  <div id="pad" style="position:relative;width:260px;height:120px;border:1px solid #ccc;background:#fafafa">
    <div id="knob" style="position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:#2a9d8f;cursor:grab"></div>
  </div>
  <p>knob: <span id="knobout">8,8</span> · clicks: <span id="clickout">0</span></p>
  <script>
    (function () {
      const knob = document.getElementById('knob');
      const out = document.getElementById('knobout');
      let dragging = false;
      knob.addEventListener('pointerdown', (e) => { dragging = true; knob.setPointerCapture(e.pointerId); });
      knob.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const pad = document.getElementById('pad').getBoundingClientRect();
        const x = Math.round(e.clientX - pad.left - 13);
        const y = Math.round(e.clientY - pad.top - 13);
        knob.style.left = x + 'px';
        knob.style.top = y + 'px';
        out.textContent = x + ',' + y;
      });
      knob.addEventListener('pointerup', () => { dragging = false; });
      document.getElementById('pad').addEventListener('click', () => {
        const el = document.getElementById('clickout');
        el.textContent = String(Number(el.textContent) + 1);
      });
    })();
  </script>
</section>
</body>
</html>
